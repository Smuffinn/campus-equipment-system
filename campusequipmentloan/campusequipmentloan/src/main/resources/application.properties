spring.application.name=campusequipmentloan

# Database Configuration (H2 In-Memory Database)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
# Hide SQL logs in console
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (for development/testing)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server Configuration
server.port=8080

# Logging Configuration (reduce noise)
# Root logger
logging.level.root=INFO

# Your app logs
logging.level.edu.cit.tabungar.stevenjan.campusequipmentloan=INFO

# Reduce Spring Web noise
logging.level.org.springframework=INFO
logging.level.org.springframework.web=INFO

# Quiet Hibernate
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF

# Optional: reduce startup info
spring.main.log-startup-info=false
